class Controller {

        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);

function dibujarGraficoTorta(ctx, anchoCanvas, altoCanvas, datos) {
    let cx = anchoCanvas / 2;
    let cy = altoCanvas / 2;
    let radio = 200;

    let colores = ['red', 'blue', 'green', 'white', 'yellow', 'purple'];

    let anguloInicio = -Math.PI / 2;

    datos.forEach((valor, i) => {

        let anguloBarrido = valor * 2 * Math.PI;
        let anguloFin = anguloInicio + anguloBarrido;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radio, anguloInicio, anguloFin);
        ctx.closePath();
        ctx.fillStyle = colores[i % colores.length];
        ctx.fill();
        ctx.stroke();

        let anguloMedio = anguloInicio + anguloBarrido / 2;
        let radioTexto = radio * 0.65;
        let tx = cx + radioTexto * Math.cos(anguloMedio);
        let ty = cy + radioTexto * Math.sin(anguloMedio);

        ctx.fillStyle = 'black';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(Math.round(valor * 100) + '%', tx, ty);

        anguloInicio = anguloFin;
    });
}
