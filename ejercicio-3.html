class Controller {

function dibujarCruzDiagonal(ctx, ancho, alto) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(ancho, alto);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(ancho, 0);
    ctx.lineTo(0, alto);
    ctx.stroke();
}

function dibujarTriangulo(ctx, p1, p2, p3) {

    ctx.beginPath();
   
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.stroke();
}

function dibujarPoligonoCentrado(ctx, puntos, anchoCanvas, altoCanvas) {
    if (!puntos || puntos.length < 3) return; 

    let sumaX = 0;
    let sumaY = 0;
    puntos.forEach(p => {
        sumaX += p.x;
        sumaY += p.y;
    });
    let centroideX = sumaX / puntos.length;
    let centroideY = sumaY / puntos.length;

    let offsetX = (anchoCanvas / 2) - centroideX;
    let offsetY = (altoCanvas / 2) - centroideY;

    ctx.beginPath();
    ctx.moveTo(puntos[0].x + offsetX, puntos[0].y + offsetY);
    for (let i = 1; i < puntos.length; i++) {
        ctx.lineTo(puntos[i].x + offsetX, puntos[i].y + offsetY);
    }
    ctx.closePath();
    ctx.stroke();
}
