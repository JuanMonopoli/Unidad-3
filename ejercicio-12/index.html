<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8" />
<title>Unidad-3</title>
<meta name="generator" content="Geany 2.0" />
<script src="MVCCanvas.js"></script>
<script src="ejercicio-12.js"></script>
</head>

<body>

</body>

<script>

function main()
{
	let modelo = new ModelEj6();
	let vista = new View();
	let controlador = new ControllerEj6(vista, modelo);

	controlador.enable();

	let selectTipoLinea = document.createElement('select');
	['solida', 'punteada', 'discontinua'].forEach(valor => {
		let opcion = document.createElement('option');
		opcion.value = valor;
		opcion.innerText = valor;
		selectTipoLinea.appendChild(opcion);
	});

	let inputGrosor = document.createElement('input');
	inputGrosor.type = 'number';
	inputGrosor.min = '1';
	inputGrosor.value = '1';

	let btnCargar = document.createElement('button');
	btnCargar.innerText = 'Cargar figura';
	btnCargar.onclick = () =>
	{
		vista.dispatchEvent(new CustomEvent('request', {
			detail: {
				accion: 'cargar',
				tipoLinea: selectTipoLinea.value,
				grosor: inputGrosor.value
			}
		}));
	}

	let btnLimpiar = document.createElement('button');
	btnLimpiar.innerText = 'Limpiar';
	btnLimpiar.onclick = () =>
	{
		vista.dispatchEvent(new CustomEvent('request', { detail: { accion: 'limpiar' } }));
	}

	document.body.appendChild(selectTipoLinea);
	document.body.appendChild(inputGrosor);
	document.body.appendChild(btnCargar);
	document.body.appendChild(btnLimpiar);
	document.body.appendChild(vista);
}

window.onload = main;

</script>

</html>
