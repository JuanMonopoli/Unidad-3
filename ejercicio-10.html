class Controller {
    constructor(view, model) {
        this._view = view;

        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);

function dibujarLineaQuebrada(ctx, p1, p2, p3, cap, join) {
    ctx.lineWidth = 30;
    ctx.lineCap = cap;
    ctx.lineJoin = join;

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.stroke();

    ctx.lineWidth = 1;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';
}

function dibujarLineasQuebradas(ctx, anchoCanvas, altoCanvas) {
    let xIzq = 150;
    let xMed = 400;
    let xDer = 650;

    let combinaciones = [
        { y: 150, cap: 'butt',   join: 'miter' },
        { y: 400, cap: 'round',  join: 'round' },
        { y: 650, cap: 'square', join: 'bevel' }
    ];

    combinaciones.forEach(({ y, cap, join }) => {
        let p1 = { x: xIzq, y: y + 60 };
        let p2 = { x: xMed, y: y - 60 };
        let p3 = { x: xDer, y: y + 60 };

        dibujarLineaQuebrada(ctx, p1, p2, p3, cap, join);
    });
}
